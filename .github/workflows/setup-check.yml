name: Application Setup Check

# Runs on every push / PR to verify that the full application stack
# (backend + frontend + Postgres + Redis) can be installed, started,
# and passes a basic health check — exactly as a developer would when
# cloning the repository to their local machine.

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Install & verify backend dependencies (Python venv, no Docker)
  # ─────────────────────────────────────────────────────────────────────
  backend-install:
    name: Backend — install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify key packages are importable
        run: |
          python - <<'EOF'
          import fastapi, uvicorn, sqlalchemy, celery, redis, pandas, sklearn
          print("✅ All core backend packages imported successfully")
          EOF

  # ─────────────────────────────────────────────────────────────────────
  # 2. Install & build frontend (Node / npm)
  # ─────────────────────────────────────────────────────────────────────
  frontend-install:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Verify build output
        run: |
          if [ -d "frontend/dist" ] && [ "$(ls -A frontend/dist)" ]; then
            echo "✅ Frontend build artifacts present in frontend/dist"
          else
            echo "❌ frontend/dist is empty or missing"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # 3. Full-stack smoke test using Docker Compose
  #    Mirrors what a developer does after cloning the repo:
  #      git clone …
  #      cp .env.example .env
  #      docker compose -f infra/docker-compose.yml up --build -d
  #      curl http://localhost:8000/health
  # ─────────────────────────────────────────────────────────────────────
  fullstack-smoke-test:
    name: Full-stack — Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend-install, frontend-install]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy environment file
        run: cp .env.example .env

      - name: Build and start all services
        run: |
          docker compose -f infra/docker-compose.yml up --build -d
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

      - name: Wait for backend health endpoint
        timeout-minutes: 5
        run: |
          echo "Waiting for backend to be healthy…"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "  attempt $i/30 — retrying in 10s…"
            sleep 10
          done
          echo "❌ Backend health check timed out"
          docker compose -f infra/docker-compose.yml logs backend
          exit 1

      - name: Verify API docs endpoint
        run: |
          curl -sf http://localhost:8000/docs -o /dev/null
          echo "✅ API docs endpoint reachable (/docs)"

      - name: Show running containers
        if: always()
        run: docker compose -f infra/docker-compose.yml ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs
